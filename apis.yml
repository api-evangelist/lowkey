name: Lowkey
description: >-
  Lowkey (lowkey.gg) was a San Francisco social gaming platform that let players
  automatically record, review, and share their gameplay highlight clips across
  titles like League of Legends, VALORANT, and Among Us. Backed by Y Combinator
  and an a16z Series A, the company was acquired by Niantic (the developer of
  Pokemon GO) and the consumer product was subsequently discontinued. It was
  surfaced as an a16z portfolio company and added to the API Evangelist network
  as a stub. An enrichment pass on 2026-07-20 found no live public developer
  surface: the lowkey.gg domain no longer resolves/serves, and there is no public
  API, OpenAPI, documentation portal, SDK, or MCP server to harvest.
